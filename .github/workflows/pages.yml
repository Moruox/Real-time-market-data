name: Refresh data and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * 1-5'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install data readers
        run: python -m pip install -r requirements.txt
      - name: Check quote parsing
        run: |
          python -m unittest discover -s tests -v
          node --test tests/*.test.mjs
      - name: Update public quote snapshot
        run: python scripts/update_data.py
      - uses: actions/configure-pages@v5
      - name: Prepare static website
        run: |
          mkdir -p _site/data
          cp index.html styles.css app.js quotes.js analysis.js favicon.svg config.json .nojekyll _site/
          cp data/quotes.json _site/data/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
